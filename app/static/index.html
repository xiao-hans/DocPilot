<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocPilot — 文档智能提取</title>
    <style>
      /* ===== 设计令牌（minimal design system）===== */
      :root {
        --primary: #0c0c09;
        --secondary: #312c85;
        --success: #16a34a;
        --warning: #d97706;
        --danger: #dc2626;
        --surface: #f4f4f1;
        --surface-raised: #ffffff;
        --border: #d8d8d2;
        --text: #0c0c09;
        --text-muted: #5c5c55;

        --font-body:
          "Open Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-display: "Inter", "Open Sans", system-ui, sans-serif;
        --font-mono:
          "Inconsolata", ui-monospace, "Cascadia Code", "Consolas", monospace;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;

        --focus-ring: 2px solid var(--secondary);
        --radius: 4px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--surface);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.6;
        min-height: 100vh;
        padding: var(--space-6) var(--space-5) var(--space-6);
      }

      /* 键盘焦点：必须可见，且不为鼠标点击添加视觉噪音 */
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: var(--focus-ring);
        outline-offset: 2px;
      }

      .page {
        max-width: 880px;
        margin: 0 auto;
      }

      /* ===== 头部 ===== */
      .page-header {
        margin-bottom: var(--space-6);
        padding-bottom: var(--space-4);
        border-bottom: 1px solid var(--border);
      }
      .page-title {
        font-family: var(--font-display);
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .page-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-top: var(--space-1);
      }

      /* ===== 区块 ===== */
      .section {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-5);
        margin-bottom: var(--space-4);
      }
      .section-title {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: var(--space-4);
      }
      .section-step {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        margin-right: var(--space-2);
        background: var(--primary);
        color: var(--surface-raised);
        font-size: 0.8rem;
        font-weight: 700;
        border-radius: 50%;
        vertical-align: 2px;
      }

      label {
        display: block;
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: var(--space-2);
      }
      .hint {
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      /* JSON 编辑器 */
      textarea {
        width: 100%;
        height: 200px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-3);
        font-family: var(--font-mono);
        font-size: 0.85rem;
        line-height: 1.5;
        resize: vertical;
        transition: border-color 120ms ease;
      }
      textarea:hover {
        border-color: var(--text-muted);
      }
      textarea:focus-visible {
        border-color: var(--secondary);
      }

      /* ===== 按钮 ===== */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        background: var(--primary);
        color: var(--surface-raised);
        border: 1px solid var(--primary);
        border-radius: var(--radius);
        padding: var(--space-2) var(--space-5);
        font-family: var(--font-display);
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.4;
        cursor: pointer;
        transition:
          background-color 120ms ease,
          border-color 120ms ease;
      }
      .btn:hover:not(:disabled) {
        background: #26261f;
        border-color: #26261f;
      }
      .btn:active:not(:disabled) {
        background: var(--primary);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .file-row {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        flex-wrap: wrap;
        margin-top: var(--space-2);
      }
      input[type="file"] {
        font-family: var(--font-body);
        font-size: 0.9rem;
        color: var(--text);
      }
      input[type="file"]::file-selector-button {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-2) var(--space-3);
        font-family: var(--font-body);
        font-size: 0.9rem;
        margin-right: var(--space-3);
        cursor: pointer;
        transition: border-color 120ms ease;
      }
      input[type="file"]::file-selector-button:hover {
        border-color: var(--text-muted);
      }

      /* ===== 状态 ===== */
      .status {
        display: flex;
        align-items: flex-start;
        gap: var(--space-2);
        color: var(--text-muted);
        font-size: 0.9rem;
        min-height: 24px;
      }
      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        flex: none;
        margin-top: 7px;
      }
      .status.is-active::before {
        background: var(--secondary);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .status.is-success::before {
        background: var(--success);
      }
      .status.is-error {
        color: var(--danger);
      }
      .status.is-error::before {
        background: var(--danger);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .error {
        color: var(--danger);
        font-size: 0.9rem;
        margin-top: var(--space-2);
      }

      /* ===== 结果表格 ===== */
      .result-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        margin-top: var(--space-2);
      }
      caption {
        text-align: left;
        font-size: 0.85rem;
        color: var(--text-muted);
        padding-bottom: var(--space-2);
      }
      th {
        text-align: left;
        font-weight: 700;
        color: var(--text);
        border-bottom: 2px solid var(--text);
        padding: var(--space-2) var(--space-3);
        white-space: nowrap;
      }
      td {
        border-bottom: 1px solid var(--border);
        padding: var(--space-2) var(--space-3);
        word-break: break-all;
        vertical-align: top;
      }
      tbody tr:hover td {
        background: var(--surface);
      }

      #result-area {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1 class="page-title">DocPilot</h1>
        <p class="page-subtitle">
          文档智能提取 — 上传文件，自动提取结构化字段并导出 Excel
        </p>
      </header>

      <section class="section">
        <h2 class="section-title">
          <span class="section-step" aria-hidden="true">1</span>字段定义
        </h2>
        <label for="fields-input"
          >字段 JSON（每项需含 name / type / description）</label
        >
        <textarea
          id="fields-input"
          spellcheck="false"
          aria-describedby="fields-hint"
        ></textarea>
        <p class="hint" id="fields-hint">type 取值：text / number / date</p>
      </section>

      <section class="section">
        <h2 class="section-title">
          <span class="section-step" aria-hidden="true">2</span>上传文件
        </h2>
        <div class="file-row">
          <input
            type="file"
            id="file-input"
            multiple
            accept=".pdf,.png,.jpg,.jpeg"
            aria-describedby="file-hint"
          />
          <button class="btn" id="upload-btn">上传并提取</button>
        </div>
        <p class="hint" id="file-hint">
          支持 .pdf / .png / .jpg / .jpeg，可多选
        </p>
      </section>

      <section class="section">
        <h2 class="section-title">
          <span class="section-step" aria-hidden="true">3</span>任务状态
        </h2>
        <div class="status" id="status-bar" role="status" aria-live="polite">
          等待上传…
        </div>
        <div class="error" id="error" role="alert"></div>
      </section>

      <section class="section" id="result-area">
        <h2 class="section-title">
          <span class="section-step" aria-hidden="true">4</span>提取结果
        </h2>
        <div class="result-wrap" id="result-table-wrap"></div>
      </section>
    </div>

    <script>
      (function () {
        var INVOICE = [
          {
            name: "发票号码",
            type: "text",
            description: "发票右上角的发票号码（20 位数字）",
          },
          {
            name: "开票日期",
            type: "date",
            description: "发票上的开票日期，格式 YYYY-MM-DD",
          },
          {
            name: "销售方名称",
            type: "text",
            description: "销售方（销货单位）的全称",
          },
          {
            name: "购买方名称",
            type: "text",
            description: "购买方（购货单位）的全称",
          },
          {
            name: "价税合计",
            type: "number",
            description: "发票右下角的价税合计（含税金额），数字，单位元",
          },
          {
            name: "税额",
            type: "number",
            description: "发票上的合计税额，数字，单位元",
          },
        ];

        var fieldsEl = document.getElementById("fields-input");
        fieldsEl.value = JSON.stringify(INVOICE, null, 2);

        document
          .getElementById("upload-btn")
          .addEventListener("click", doUpload);

        function doUpload() {
          var files = document.getElementById("file-input").files;
          if (!files.length) {
            showError("请选择文件");
            return;
          }
          var fieldsText = fieldsEl.value.trim();
          try {
            JSON.parse(fieldsText);
          } catch (e) {
            showError("字段 JSON 格式错误: " + e.message);
            return;
          }

          var fd = new FormData();
          for (var i = 0; i < files.length; i++) fd.append("files", files[i]);
          fd.append("fields", fieldsText);

          var btn = document.getElementById("upload-btn");
          btn.disabled = true;
          setStatus("上传中…", "is-active");
          document.getElementById("error").textContent = "";
          document.getElementById("result-area").style.display = "none";

          fetch("/api/jobs", { method: "POST", body: fd })
            .then(function (r) {
              return r.json().then(function (d) {
                return { status: r.status, body: d };
              });
            })
            .then(function (res) {
              if (res.status !== 201) {
                showError(
                  "创建失败: " + (res.body.detail || JSON.stringify(res.body)),
                );
                btn.disabled = false;
                setStatus("就绪");
                return;
              }
              setStatus("任务已创建 " + res.body.job_id, "is-active");
              pollJob(res.body.job_id, 0);
            })
            .catch(function (e) {
              showError("网络错误: " + e);
              btn.disabled = false;
            });
        }

        function pollJob(jobId, count) {
          if (count >= 60) {
            setStatus("轮询超时");
            document.getElementById("upload-btn").disabled = false;
            return;
          }
          fetch("/api/jobs/" + jobId)
            .then(function (r) {
              return r.json();
            })
            .then(function (job) {
              setStatus(
                "状态: " + job.status + "  |  进度: " + job.progress,
                "is-active",
              );
              if (job.status === "succeeded" || job.status === "failed") {
                document.getElementById("upload-btn").disabled = false;
                if (job.status === "succeeded") {
                  fetchResult(jobId);
                } else {
                  showError("任务失败: " + (job.error || "未知错误"));
                }
                return;
              }
              setTimeout(function () {
                pollJob(jobId, count + 1);
              }, 1000);
            })
            .catch(function () {
              setTimeout(function () {
                pollJob(jobId, count + 1);
              }, 1000);
            });
        }

        function setStatus(msg, cls) {
          var bar = document.getElementById("status-bar");
          bar.textContent = msg;
          bar.className = "status" + (cls ? " " + cls : "");
        }

        function showError(msg) {
          document.getElementById("error").textContent = msg;
          setStatus("处理失败", "is-error");
        }

        function fetchResult(jobId) {
          fetch("/api/jobs/" + jobId + "/result")
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              if (!data.result || !data.result.length) {
                showError("无提取结果");
                setStatus("任务成功，无提取结果", "is-success");
                return;
              }
              var fieldNames = [];
              if (data.result[0] && data.result[0].values) {
                fieldNames = Object.keys(data.result[0].values);
              }
              var wrap = document.getElementById("result-table-wrap");
              wrap.textContent = "";
              var table = document.createElement("table");
              var cap = document.createElement("caption");
              cap.textContent = "共 " + data.result.length + " 个文件";
              table.appendChild(cap);
              var thead = document.createElement("thead");
              var hrow = document.createElement("tr");
              var th0 = document.createElement("th");
              th0.textContent = "文件";
              th0.scope = "col";
              hrow.appendChild(th0);
              fieldNames.forEach(function (fn) {
                var th = document.createElement("th");
                th.textContent = fn;
                th.scope = "col";
                hrow.appendChild(th);
              });
              thead.appendChild(hrow);
              table.appendChild(thead);
              var tbody = document.createElement("tbody");
              data.result.forEach(function (row) {
                var tr = document.createElement("tr");
                var tdFile = document.createElement("td");
                tdFile.textContent = row.file || "";
                tr.appendChild(tdFile);
                fieldNames.forEach(function (fn) {
                  var td = document.createElement("td");
                  var v =
                    row.values && row.values[fn] != null ? row.values[fn] : "—";
                  td.textContent = String(v);
                  tr.appendChild(td);
                });
                tbody.appendChild(tr);
              });
              table.appendChild(tbody);
              wrap.appendChild(table);
              document.getElementById("result-area").style.display = "block";
              setStatus("任务成功 — Excel 可在 Job 页面导出", "is-success");
            });
        }
      })();
    </script>
  </body>
</html>
