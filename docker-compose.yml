# DocPilot 本地开发依赖栈（docs/17 §3）。基础设施三件套始终启动；应用侧容器挂在 profile: app 下。
# 凭据来自同目录 .env（已 gitignore），见 .env.example。

name: docpilot-dev

# 应用侧容器（profile: app）。默认 `docker compose up` 仍只起基础设施，G1 以来的开发基线不变；
# 要整栈（含 API/派发器/Worker）用 `docker compose --profile app`。
#
# 为什么容器要一套单独的地址（APP_* 变量）：容器内连不到 Windows 侧的 127.0.0.1，
# 必须走 compose 网络里的服务名（postgres / rabbitmq / object-store）。主机侧脚本仍用 127.0.0.1。
#
# 锚点必须在 services 之前定义，也必须在被引用的那个键之前完整展开——所以这两块放文件顶部。
# 变量一律带空默认值而不是 ${VAR:?}：:? 会在解析整份文件时求值，
# 没启用 app profile 的 `docker compose up` 也会被拖垮。缺配置交给 app 自己的配置校验报错。
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: ${APP_DATABASE_URL:-}
  BROKER_URL: ${APP_BROKER_URL:-}
  QUEUE_NAME: ${QUEUE_NAME:-docpilot.processing}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  # 容器里连不到主机侧发布的 127.0.0.1:8333，所以端点单独用一个 APP_ 前缀的键，
  # 默认走 compose 服务名。与主机侧 .env 的 S3_ENDPOINT_URL 同名会怎样？开发基线里那正是
  # 127.0.0.1，同一份 .env 喂给容器就会表现为对象读写全失败——所以这里不接受那个值。
  S3_ENDPOINT_URL: ${APP_S3_ENDPOINT_URL:-http://object-store:8333}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_KEY_PREFIX: ${S3_KEY_PREFIX:-docpilot}
  BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
  EXTRACTOR_MODE: ${EXTRACTOR_MODE:-mock}
  DISPATCH_POLL_SECONDS: ${DISPATCH_POLL_SECONDS:-2}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}

x-app-build: &app-build
  build: .
  image: docpilot-app:dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: docpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?缺少 POSTGRES_USER，请参考 .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺少 POSTGRES_PASSWORD，请参考 .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-docpilot}
      TEST_DATABASE: ${TEST_DATABASE:-docpilot_test}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: docpilot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?缺少 RABBITMQ_USER，请参考 .env.example}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?缺少 RABBITMQ_PASSWORD，请参考 .env.example}
    ports:
      - "127.0.0.1:5672:5672"
      # 管理端点只用于本机排查队列积压，不向局域网开放（docs/17 §7）。
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

  # 本机 S3 兼容模拟器（docs/17 §3）。MinIO 社区仓库已于 2026-04-25 归档，
  # 因此开发依赖改用 SeaweedFS；它只用于本机验证 S3 接口兼容性，不构成生产选型。
  object-store:
    image: chrislusf/seaweedfs:4.22
    container_name: docpilot-object-store
    restart: unless-stopped
    # 不指定 -logdir：glog 会因目录不存在反复退出，日志交给 stderr 由 Docker 收集。
    # S3 对象目录由 `-dir` 派生（该版本没有 -smdir）。
    # `-ip` 必须是可回连的地址，用 0.0.0.0 会让 master 客户端连到 0.0.0.0:9333 失败；
    # 因此绑定所有网卡但自报 127.0.0.1（端口本身只发布到 127.0.0.1）。
    command: server -s3 -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # 一次性迁移服务：迁移不藏在 API 的 lifespan 里（docs/17 §4），跑完就退出，
  # 其余三个服务用 service_completed_successfully 等它成功——失败会让 up 直接失败，
  # 而不是留下一个"起来了但库还是旧的"栈。
  migrate:
    profiles: ["app"]
    <<: *app-build
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    profiles: ["app"]
    <<: *app-build
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      object-store:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-data:/srv/docpilot/data

  dispatcher:
    profiles: ["app"]
    <<: *app-build
    command: ["python", "-m", "app.dispatcher"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true

  # 一个 Worker 就够端到端用；要压并发用 --scale worker=N（队列名共用，天然分活）。
  worker:
    profiles: ["app"]
    <<: *app-build
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      object-store:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres-data:
  rabbitmq-data:
  object-store-data:
  app-data:
