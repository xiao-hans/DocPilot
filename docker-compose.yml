# DocPilot 本地开发依赖栈（docs/17 §3）。只承载基础设施：
# 应用与 Worker 仍在仓库的 Python venv 中运行，端口只绑 127.0.0.1。
# 凭据来自同目录 .env（已 gitignore），见 .env.example。

name: docpilot-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: docpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?缺少 POSTGRES_USER，请参考 .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺少 POSTGRES_PASSWORD，请参考 .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-docpilot}
      TEST_DATABASE: ${TEST_DATABASE:-docpilot_test}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
