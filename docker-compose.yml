# DocPilot 本地开发依赖栈（docs/17 §3）。只承载基础设施：
# 应用与 Worker 仍在仓库的 Python venv 中运行，端口只绑 127.0.0.1。
# 凭据来自同目录 .env（已 gitignore），见 .env.example。

name: docpilot-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: docpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?缺少 POSTGRES_USER，请参考 .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺少 POSTGRES_PASSWORD，请参考 .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-docpilot}
      TEST_DATABASE: ${TEST_DATABASE:-docpilot_test}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: docpilot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?缺少 RABBITMQ_USER，请参考 .env.example}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?缺少 RABBITMQ_PASSWORD，请参考 .env.example}
    ports:
      - "127.0.0.1:5672:5672"
      # 管理端点只用于本机排查队列积压，不向局域网开放（docs/17 §7）。
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 25s

  # 本机 S3 兼容模拟器（docs/17 §3）。MinIO 社区仓库已于 2026-04-25 归档，
  # 因此开发依赖改用 SeaweedFS；它只用于本机验证 S3 接口兼容性，不构成生产选型。
  object-store:
    image: chrislusf/seaweedfs:4.22
    container_name: docpilot-object-store
    restart: unless-stopped
    # 不指定 -logdir：glog 会因目录不存在反复退出，日志交给 stderr 由 Docker 收集。
    # S3 对象目录由 `-dir` 派生（该版本没有 -smdir）。
    # `-ip` 必须是可回连的地址，用 0.0.0.0 会让 master 客户端连到 0.0.0.0:9333 失败；
    # 因此绑定所有网卡但自报 127.0.0.1（端口本身只发布到 127.0.0.1）。
    command: server -s3 -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  rabbitmq-data:
  object-store-data:
